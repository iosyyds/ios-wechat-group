<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS微信交流群</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f0f2f5 0%, #e8ebf0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            padding: 24px;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
            padding: 32px 28px 24px;
            width: 100%;
            max-width: 380px;
            animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
        .header { text-align: center; margin-bottom: 28px; }
        .header-title { font-size: 1.2rem; font-weight: 700; color: #1a1a1a; letter-spacing: -0.01em; }
        .header-line { width: 32px; height: 3px; background: linear-gradient(90deg, #07c160, #12b7f5); border-radius: 2px; margin: 10px auto 0; }
        .qr-block { text-align: center; margin-bottom: 24px; animation: fadeUp 0.5s ease-out backwards; }
        @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
        .qr-label { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.92rem; font-weight: 600; color: #333; margin-bottom: 14px; }
        .qr-label .icon { width: 22px; height: 22px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
        .qr-label .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .qr-frame { display: inline-block; padding: 10px; background: #fafafa; border: 1px solid #f0f0f2; border-radius: 14px; transition: transform 0.2s ease; }
        .qr-frame:hover { transform: scale(1.02); }
        .qr-frame img { display: block; width: 150px; height: 150px; border-radius: 6px; }
        .divider { height: 1px; background: #f0f0f2; margin: 0 0 20px; }
        .footer { text-align: center; animation: fadeUp 0.5s 0.2s ease-out backwards; }
        .footer-tip { font-size: 0.8rem; color: #999; margin-bottom: 12px; }
        .copy-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 600; color: #333; background: #f5f5f7; border: none; padding: 9px 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .copy-btn:hover { background: #ebebef; }
        .copy-btn:active { transform: scale(0.97); }
        .copy-btn .wechat-name { color: #07c160; }
        .copy-btn svg { width: 13px; height: 13px; color: #999; }
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-8px); background: rgba(0,0,0,0.78); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 0.82rem; opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 999; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
    <link rel="icon" href="https://res.wx.qq.com/a/wx_fed/assets/res/NTI4MWU5.ico">
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="header-title">iOS微信交流群</div>
            <div class="header-line"></div>
        </div>
        <div class="qr-block">
            <div class="qr-label">
                <span class="icon"><img src="wechat.png" alt="微信"></span>
                加微信回复"进群"
            </div>
            <div class="qr-frame"><div id="qr-wechat"></div></div>
        </div>
        <div class="divider"></div>
        <div class="footer">
            <div class="footer-tip">不想扫码？复制微信号直接添加</div>
            <button class="copy-btn" id="copy-btn">
                <span class="wechat-name">nbioss</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
        </div>
    </div>
    <div class="toast" id="toast">已复制到剪贴板</div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            new QRCode(document.getElementById("qr-wechat"), {
                text: "https://u.wechat.com/EMw5cw9h1vShFauLLkif3vY",
                width: 150, height: 150,
                correctLevel: QRCode.CorrectLevel.H
            });
            var copyBtn = document.getElementById("copy-btn");
            var toast = document.getElementById("toast");
            copyBtn.addEventListener("click", function () {
                var text = "nbioss";
                var textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
                toast.classList.add("show");
                setTimeout(function() { toast.classList.remove("show"); }, 1200);
            });
        });
    </script>
</body>
</html>
